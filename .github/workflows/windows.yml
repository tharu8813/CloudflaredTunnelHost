name: Windows WPF
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build CloudflaredTunnelHost.sln -c Release
      - name: Core regression checks
        run: dotnet run --project Tests/CloudflaredTunnelHost.Tests.csproj -c Release --no-build
      - name: WPF rendering and binding checks
        run: dotnet run --project Tests/Wpf/CloudflaredTunnelHost.WpfTests.csproj -c Release --no-build -- --allow-no-tray
      - name: Publish Windows x64 portable app
        run: dotnet publish CloudflaredTunnelHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .artifacts/publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wpf-checks
          path: |
            .artifacts/*.png
            .artifacts/*results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CloudflaredTunnelHost-win-x64
          path: .artifacts/publish/
